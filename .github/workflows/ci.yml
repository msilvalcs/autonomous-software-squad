name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      LLM_PROVIDER: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build workspaces
        run: npm run build

  docker-image:
    name: Build Docker Runner image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Build pinned runner image
        run: >-
          docker build
          --file docker/runner.Dockerfile
          --tag autonomous-squad-runner:ci
          .

      - name: Install template dependencies
        run: npm ci --prefix templates/react-task-app

      - name: Build packages for integration test
        run: npm run build:packages

      - name: Validate Developer to Docker Runner Playwright flow
        env:
          RUN_DOCKER_PLAYWRIGHT_INTEGRATION: "1"
          DOCKER_RUNNER_IMAGE: autonomous-squad-runner:ci
        run: npm run test:integration:docker -w @squad/orchestrator
